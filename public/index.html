<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ခရီးသည် - ယာဉ်မောင်းခေါ်ယူရန်</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}body{font-family:sans-serif;margin:0}#map{height:52vh;width:100%}.panel{padding:12px;max-height:48vh;overflow:auto}.field{width:100%;padding:9px;margin:4px 0 8px;border:1px solid #ccc;border-radius:5px}button{padding:9px 12px;background:#087cf0;color:white;border:0;border-radius:5px;margin:3px;cursor:pointer}.driver-card{display:flex;align-items:center;gap:10px;border:1px solid #ddd;background:#fafafa;padding:9px;margin:8px 0;border-radius:8px;text-align:left}.driver-card img{width:48px;height:48px;object-fit:cover;border-radius:50%}.driver-info{flex:1;font-size:13px}.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.online{background:#28a745}.offline{background:#dc3545}#status{font-weight:bold}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h3>ခရီးသည် အချက်အလက်</h3>
    <input id="passengerPhone" class="field" type="tel" placeholder="သင့်ဖုန်းနံပါတ် (09...)">
    <input id="destinationInput" class="field" type="text" placeholder="သွားမည့်နေရာ / ဟိုတယ်အမည်">
    <button onclick="searchDestination()">နေရာရှာမည်</button><button onclick="refreshLocation()" style="background:#28a745">မိမိတည်နေရာရှာမည်</button>
    <p id="status">အခြေအနေ: GPS တည်နေရာကို စောင့်ဆိုင်းနေသည်။</p><p id="coords">Lat: -, Lng: -</p><p id="passenger-status">ယာဉ်မောင်း ရွေးချယ်ပါ။</p>
    <div id="driversList"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/socket.io/socket.io.js"></script>
  <script>
// Socket.io ချိတ်ဆက်ခြင်း
const socket = io();

// ခရီးသည်ဘက်တွင် Map စတင်ခြင်း
const map = L.map('map').setView([21.9833, 100.0833], 14);
L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    attribution: '© Google'
}).addTo(map);

let driverMarker = null;
let myMarker = null;

// ခရီးသည်၏ GPS တည်နေရာကို ရယူပြီး ဆာဗာသို့ ပို့ခြင်းနှင့် ကိုယ့် Marker ကိုပြသခြင်း
if (navigator.geolocation) {
    navigator.geolocation.watchPosition((position) => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const latLng = [lat, lng];

        if (!myMarker) {
            myMarker = L.marker(latLng).addTo(map).bindPopup("သင်၏ တည်နေရာ");
        } else {
            myMarker.setLatLng(latLng);
        }

        // ဆာဗာဆီသို့ ခရီးသည်၏ lat, lng ကို ပို့ပေးသည်
        socket.emit('passengerLocationUpdate', { lat, lng });
    }, (error) => {
        console.error("GPS Error: ", error);
    }, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 5000
    });
}

// ယာဉ်မောင်းဘက်မှ ရွေ့လျားလာသော တည်နေရာကို ခရီးသည်ဘက်တွင် Real-time ဖြင့် Marker ရွေ့ပြရန်
socket.on('driverLocationUpdate', (data) => {
    if (data && data.lat && data.lng) {
        const latLng = [data.lat, data.lng];
        if (!driverMarker) {
            driverMarker = L.marker(latLng).addTo(map).bindPopup("ယာဉ်မောင်း တည်နေရာ");
        } else {
            // ယာဉ်မောင်းရွေ့လျားမှုကို Map ပေါ်တွင် တိကျချောမွေ့စွာ Update လုပ်ပေးသည်
            driverMarker.setLatLng(latLng);
        }
    }
});
 
 </script>
</body>
</html>
